[project]
name = "n0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]   # your tests; the grader is run separately: `uv run python -m grader`
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
